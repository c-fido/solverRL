name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gtest:
    name: CMake + GoogleTest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install "pybind11>=3.0"

      - name: Configure + build + test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j
          ctest --test-dir build --output-on-failure -C Release

  pytest:
    name: Python extension + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          # Keep CI off the CUDA wheel; pin to match requirements.txt.
          pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Install package (editable) + deps
        run: |
          # Avoid re-resolving torch from PyPI (would pull CUDA).
          grep -v '^torch' requirements.txt > /tmp/requirements-no-torch.txt
          pip install -r /tmp/requirements-no-torch.txt
          pip install -e . --no-build-isolation

      - name: Pytest (exclude slow)
        run: |
          # pytest.ini already sets -m "not slow"; integration smokes still run.
          pytest -q --tb=short
